# Deploy your own ZeroByte Relay to Cloudflare Workers.
#
#   1. Set RELAY_APPS below (generate ids with `npm run app-id`).
#   2. Uncomment `routes` to serve it on your own domain, or keep workers.dev.
#   3. npx wrangler deploy
#
# relay.zerobyte.cloud, the hosted relay, runs wrangler.hosted.toml.

name = "my-zerobyte-relay"
main = "src/cloudflare.js"
compatibility_date = "2026-10-01"

# routes = [{ pattern = "relay.example.com", custom_domain = true }]

[vars]
# <app id>[=label][;push=<bundle id>][;signal][;ice][;envelopes=N][;mailbox=MiB][;envelope=KiB][;idle=days]
RELAY_APPS = ""
# Optional, for apps with push: APNS_TEAM_ID, APNS_KEY_ID here, and
#   npx wrangler secret put APNS_PRIVATE_KEY < AuthKey_XXXXXXXXXX.p8
# and for Android: npx wrangler secret put FCM_SERVICE_ACCOUNT < service-account.json
# Optional, for apps with ice: ICE_STUN_URLS, TURN_URLS, CF_TURN_KEY_ID here,
# and TURN_SECRET / CF_TURN_API_TOKEN as secrets.

# One SQLite-backed Durable Object per mailbox.
[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mailbox"]

# No Workers Logs, no traces: the relay keeps no record of who connected.
[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false

[observability.traces]
enabled = false
