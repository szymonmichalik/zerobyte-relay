# relay.zerobyte.cloud, the hosted relay: every app is registered at
# console.zerobyte.cloud and read from the REGISTRY namespace below.
#   npx wrangler deploy -c wrangler.hosted.toml

name = "zerobyte-relay"
main = "src/cloudflare.js"
compatibility_date = "2026-10-01"
# Served only on relay.zerobyte.cloud, never on a second *.workers.dev address.
workers_dev = false
preview_urls = false

# Custom Domain: deploy creates the DNS record and the certificate itself.
# The zerobyte.cloud zone must be on the same Cloudflare account.
[[routes]]
pattern = "relay.zerobyte.cloud"
custom_domain = true

# No apps configured here: they all come from the console.
[vars]
RELAY_APPS = ""

# Apps from the console (src/registry.js). The console writes this namespace;
# the relay only reads it. REGISTRY_KEY is the same secret as the console's:
#   npx wrangler secret put REGISTRY_KEY -c wrangler.hosted.toml   # 32 bytes, base64
[[kv_namespaces]]
binding = "REGISTRY"
id = "ae842cba68eb41fab0bdd77d217891c7"

# One SQLite-backed Durable Object per mailbox.
[[durable_objects.bindings]]
name = "MAILBOX"
class_name = "Mailbox"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Mailbox"]

# Load statistics per app: operation, status class, requests and
# bytes. No mailbox, token or IP address is written (src/core.js `count`).
[[analytics_engine_datasets]]
binding = "USAGE"
dataset = "zerobyte_relay_usage"

# No Workers Logs, no traces: the relay keeps no record of who connected.
[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false

[observability.traces]
enabled = false
